#
# Cuts a release on every push to main: build what the pom says, prove it, tag it, bump for next time.
#
# THIS PROJECT DOES NOT USE -SNAPSHOT VERSIONS. main always holds a real, released version, so the JAR
# on a developer's disk is named exactly like the one on the release page - mq-mebaysanization-1.0.3.jar,
# never mq-mebaysanization-1.0.3-SNAPSHOT.jar. That is the whole point of the scheme, and it is why the
# guard below rejects a -SNAPSHOT rather than requiring one.
#
# The flow is one commit rather than the Maven-conventional two:
#
#   pom 1.0.3  ->  tag v1.0.3 on the pushed commit itself (its pom already says 1.0.3)
#              ->  commit "prepare 1.0.4" (what main is left on, ready for the next push)
#
# The tag therefore points at the exact tree that was built and tested, rather than at a commit this
# workflow synthesised afterwards.
#
# To release a minor or major instead of a patch, edit pom.xml to 1.1.0 (or 2.0.0) and push: whatever
# the pom says is what gets released, and the bump afterwards is always +1 patch from there.
#
# THE LOOP GUARD. This workflow pushes to the branch that triggers it. It does not recurse, for two
# independent reasons, and both are deliberate:
#
#   1. Pushes made with the default GITHUB_TOKEN do not trigger workflows. This is a GitHub guarantee
#      and it is the real guard. If you ever swap in a PAT or a deploy key to get around branch
#      protection, this guarantee disappears and the workflow WILL recurse.
#   2. The commit message carries [skip ci], which GitHub honours natively on push events. That is the
#      backstop for case 1, and the reason the message must not be "tidied up".
#
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      # Documentation-only changes should not mint a version. Everything else should, including the
      # workflow itself - a change to how releases are built is worth proving on a real release.
      - '**.md'
      - '.gitignore'
      - 'LICENSE'

# One release at a time. Never cancel a run in progress: it may already have pushed the release commit
# and be partway through tagging, and a half-finished release is worse than a slow one.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write # push the version commits, create the tag, create the release

jobs:
  release:
    name: Version, build and tag
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          # Full history: we push two commits and a tag back, and the release notes are generated by
          # diffing against the previous tag.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Node is a BUILD-TIME dependency that frontend-maven-plugin downloads into frontend/node during
      # prepare-package, so caching it keeps a release build off nodejs.org.
      #
      # node_modules is deliberately NOT cached: the build runs `npm ci`, which deletes node_modules
      # and reinstalls from the lockfile, so caching it would be pure overhead. ~/.npm is npm's own
      # content-addressable cache and IS what makes that reinstall fast.
      #
      # pom.xml is in the key because it pins node.version; package-lock.json because it decides what
      # ends up in ~/.npm.
      - name: Cache the Node download and the npm cache
        uses: actions/cache@v4
        with:
          path: |
            frontend/node
            ~/.npm
          key: node-${{ runner.os }}-${{ hashFiles('pom.xml', 'frontend/package-lock.json') }}
          restore-keys: node-${{ runner.os }}-

      - name: Work out the release and next versions
        id: versions
        run: |
          set -euo pipefail

          # Read the project's own version, not the parent's. Namespace-aware and anchored to the root
          # element, so <parent><version>3.5.16</version></parent> cannot be picked up by mistake the
          # way a grep for the first <version> would.
          release=$(python3 -c "import xml.etree.ElementTree as ET; ns={'m':'http://maven.apache.org/POM/4.0.0'}; print(ET.parse('pom.xml').getroot().find('m:version', ns).text.strip())")

          # Whatever the pom says IS the release - there is nothing to strip. A -SNAPSHOT here means
          # someone reintroduced the convention this project deliberately dropped, and it would ship a
          # JAR whose filename disagrees with the release page.
          if [[ "$release" == *-SNAPSHOT ]]; then
            echo "::error::pom.xml is at $release, but this project does not use -SNAPSHOT versions."
            echo "::error::main always holds a real version, so the built JAR is named like the released one."
            echo "::error::Set pom.xml to a plain x.y.z and push again."
            exit 1
          fi

          # The bump below is arithmetic on the patch component, so anything that is not three plain
          # numbers has to be refused rather than silently producing a version like "1.0.3-RC1.1".
          if [[ ! "$release" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::pom.xml is at $release, which is not a plain x.y.z version."
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/v$release" >/dev/null; then
            echo "::error::Tag v$release already exists, so this push would release over it."
            echo "::error::main was expected to have been bumped past it by the previous release."
            echo "::error::Set pom.xml to the version you actually mean to release and push again."
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$release"
          next="$major.$minor.$((patch + 1))"

          {
            echo "release=$release"
            echo "next=$next"
          } >> "$GITHUB_OUTPUT"

          echo "releasing $release, then main moves to $next"

      # No versions:set before this one: the pom already holds the release version, which is the point
      # of the scheme. The full build: tests, then the frontend, then the fat JAR. Tests run before
      # prepare-package, so a test failure costs nothing in npm time.
      - name: Build and test
        run: mvn -B -ntp clean package

      # The project's own gate, and the reason this job is worth running at all: it proves the shipped
      # JAR needs nothing but a JRE. It must run after package, or it would build its own JAR untested.
      - name: Verify portability
        run: ./scripts/verify-portability.sh

      # No stamping step here. pom.xml has no <finalName>, so Maven's default applies and the build
      # above already produced target/mq-mebaysanization-<release>.jar. A `cp` from an unversioned name
      # to the versioned one would now be `cp X X`, which is a hard error rather than a no-op.

      # Tagged at the PUSHED commit, whose pom already says <release> - no synthesised release commit
      # in between. The tag therefore points at the exact tree that was just built and tested.
      - name: Tag the release
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git tag -a "v${{ steps.versions.outputs.release }}" \
                  -m "MQ mebaysanization ${{ steps.versions.outputs.release }}"

      # main is left on the next version, so the following push releases that one. Still a real version,
      # never a -SNAPSHOT: a developer building from main gets a JAR named exactly like a released one.
      - name: Prepare the next version
        run: |
          set -euo pipefail
          mvn -B -ntp \
            org.codehaus.mojo:versions-maven-plugin:2.21.0:set \
            -DnewVersion=${{ steps.versions.outputs.next }} \
            -DgenerateBackupPoms=false
          git add pom.xml
          # [skip ci] is load-bearing, not decoration - see the loop-guard note at the top.
          git commit -m "chore(release): prepare ${{ steps.versions.outputs.next }} [skip ci]"

      # Atomic: either the commit and the tag land, or neither does. Without --atomic a push can leave
      # the tag on the remote while main still claims the version is unreleased.
      #
      # If someone pushed to main while this was building, this fails as a non-fast-forward and
      # NOTHING has been published - the tag so far exists only on the runner. Re-run the job.
      - name: Push the commit and the tag
        run: git push --atomic origin HEAD:main "refs/tags/v${{ steps.versions.outputs.release }}"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ steps.versions.outputs.release }}"
          --title "MQ mebaysanization ${{ steps.versions.outputs.release }}"
          --generate-notes
          --verify-tag

      # THE JAR IS NEVER ATTACHED TO A RELEASE, and this is a licensing decision rather than a
      # technical one. There used to be a `vars.PUBLISH_JAR` switch here; it was removed when this
      # repository went public, because a switch defended only by a YAML comment is one settings
      # click away from an irreversible mistake that the GitHub UI never explains.
      #
      # The fat JAR nests com.ibm.mq.jakarta.client byte-for-byte - about 18.4 MiB of IBM restricted
      # materials under BOOT-INF/lib/ - and that ships under the IBM International Program License
      # Agreement, not an open-source licence. On a public repository a release asset is downloadable
      # by anyone, so attaching the JAR would redistribute IBM's client to the world. An Actions
      # artifact is no safer: on a public repo those are world-readable too.
      #
      # Anyone can still build it themselves; README.md documents `mvn clean package`, and the
      # "Third-party notices" section tells them what they are then holding.
      #
      # If IBM's LI form L-RZND-SLUBFC is ever confirmed to permit redistribution of this artifact,
      # restore the step deliberately and record the finding in the repository - do not re-add a
      # switch.

      - name: Summary
        run: |
          {
            echo "### Released \`v${{ steps.versions.outputs.release }}\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Released | \`${{ steps.versions.outputs.release }}\` |"
            echo "| main now on | \`${{ steps.versions.outputs.next }}\` |"
            echo "| JAR | \`$(du -h "target/mq-mebaysanization-${{ steps.versions.outputs.release }}.jar" | cut -f1)\` |"
            echo "| JAR attached | never — it bundles the IBM MQ client; build it yourself |"
          } >> "$GITHUB_STEP_SUMMARY"
