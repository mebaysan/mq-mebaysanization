#
# Cuts a release on every push to main: bump the version, build, prove it, tag it.
#
# The version flow is the Maven convention, in two commits:
#
#   pom 1.0.0-SNAPSHOT  ->  commit "release 1.0.0"          (tagged v1.0.0)
#                       ->  commit "prepare 1.0.1-SNAPSHOT" (what main is left on)
#
# so a tag always points at a pom holding a real, non-SNAPSHOT version.
#
# THE LOOP GUARD. This workflow pushes to the branch that triggers it. It does not recurse, for two
# independent reasons, and both are deliberate:
#
#   1. Pushes made with the default GITHUB_TOKEN do not trigger workflows. This is a GitHub guarantee
#      and it is the real guard. If you ever swap in a PAT or a deploy key to get around branch
#      protection, this guarantee disappears and the workflow WILL recurse.
#   2. Both commit messages carry [skip ci], which GitHub honours natively on push events. That is the
#      backstop for case 1, and the reason the messages must not be "tidied up".
#
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      # Documentation-only changes should not mint a version. Everything else should, including the
      # workflow itself - a change to how releases are built is worth proving on a real release.
      - '**.md'
      - '.gitignore'
      - 'LICENSE'

# One release at a time. Never cancel a run in progress: it may already have pushed the release commit
# and be partway through tagging, and a half-finished release is worse than a slow one.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write # push the version commits, create the tag, create the release

jobs:
  release:
    name: Version, build and tag
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          # Full history: we push two commits and a tag back, and the release notes are generated by
          # diffing against the previous tag.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Node is a BUILD-TIME dependency that frontend-maven-plugin downloads into frontend/node during
      # prepare-package, so caching it keeps a release build off nodejs.org.
      #
      # node_modules is deliberately NOT cached: the build runs `npm ci`, which deletes node_modules
      # and reinstalls from the lockfile, so caching it would be pure overhead. ~/.npm is npm's own
      # content-addressable cache and IS what makes that reinstall fast.
      #
      # pom.xml is in the key because it pins node.version; package-lock.json because it decides what
      # ends up in ~/.npm.
      - name: Cache the Node download and the npm cache
        uses: actions/cache@v4
        with:
          path: |
            frontend/node
            ~/.npm
          key: node-${{ runner.os }}-${{ hashFiles('pom.xml', 'frontend/package-lock.json') }}
          restore-keys: node-${{ runner.os }}-

      - name: Work out the release and next development versions
        id: versions
        run: |
          set -euo pipefail

          # Read the project's own version, not the parent's. Namespace-aware and anchored to the root
          # element, so <parent><version>3.5.16</version></parent> cannot be picked up by mistake the
          # way a grep for the first <version> would.
          current=$(python3 -c "import xml.etree.ElementTree as ET; ns={'m':'http://maven.apache.org/POM/4.0.0'}; print(ET.parse('pom.xml').getroot().find('m:version', ns).text.strip())")

          if [[ "$current" != *-SNAPSHOT ]]; then
            echo "::error::pom.xml is at $current, which is not a -SNAPSHOT."
            echo "::error::main is expected to sit on a development version between releases."
            echo "::error::Set it back to a -SNAPSHOT (or delete the tag from a half-finished release) and push again."
            exit 1
          fi

          release="${current%-SNAPSHOT}"

          if git rev-parse -q --verify "refs/tags/v$release" >/dev/null; then
            echo "::error::Tag v$release already exists, so $current would release over it."
            echo "::error::That usually means a previous run tagged but failed before pushing the next snapshot."
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$release"
          next="$major.$minor.$((patch + 1))-SNAPSHOT"

          {
            echo "current=$current"
            echo "release=$release"
            echo "next=$next"
          } >> "$GITHUB_OUTPUT"

          echo "$current -> $release -> $next"

      - name: Set the release version
        run: >
          mvn -B -ntp
          org.codehaus.mojo:versions-maven-plugin:2.21.0:set
          -DnewVersion=${{ steps.versions.outputs.release }}
          -DgenerateBackupPoms=false

      # The full build: tests, then the frontend, then the fat JAR. Tests run before prepare-package,
      # so a test failure costs nothing in npm time.
      - name: Build and test
        run: mvn -B -ntp clean package

      # The project's own gate, and the reason this job is worth running at all: it proves the shipped
      # JAR needs nothing but a JRE. It must run after package, or it would build its own JAR untested.
      - name: Verify portability
        run: ./scripts/verify-portability.sh

      # finalName is fixed at mq-manager so the run command stays `java -jar target/mq-manager.jar`.
      # Stamp the version onto a copy, so an archived or attached JAR says what it is.
      - name: Stamp the version onto a copy of the JAR
        run: |
          set -euo pipefail
          cp target/mq-manager.jar "target/mq-manager-${{ steps.versions.outputs.release }}.jar"
          ls -lh target/mq-manager*.jar

      - name: Commit the release version and tag it
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # [skip ci] is load-bearing, not decoration - see the loop-guard note at the top.
          git add pom.xml
          git commit -m "chore(release): ${{ steps.versions.outputs.release }} [skip ci]"
          git tag -a "v${{ steps.versions.outputs.release }}" \
                  -m "MQ mebaysanization ${{ steps.versions.outputs.release }}"

      - name: Prepare the next development version
        run: |
          set -euo pipefail
          mvn -B -ntp \
            org.codehaus.mojo:versions-maven-plugin:2.21.0:set \
            -DnewVersion=${{ steps.versions.outputs.next }} \
            -DgenerateBackupPoms=false
          git add pom.xml
          git commit -m "chore(release): prepare ${{ steps.versions.outputs.next }} [skip ci]"

      # Atomic: either both commits and the tag land, or neither does. Without --atomic a push can
      # leave the tag on the remote without the commit carrying the matching pom.
      #
      # If someone pushed to main while this was building, this fails as a non-fast-forward and
      # NOTHING has been published - the tag so far exists only on the runner. Re-run the job.
      - name: Push the commits and the tag
        run: git push --atomic origin HEAD:main "refs/tags/v${{ steps.versions.outputs.release }}"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ steps.versions.outputs.release }}"
          --title "MQ mebaysanization ${{ steps.versions.outputs.release }}"
          --generate-notes
          --verify-tag

      # DELIBERATELY OFF, and this is a licensing decision rather than a technical one.
      #
      # The fat JAR bundles com.ibm.mq.jakarta.client, which ships under the IBM International Program
      # License Agreement, not an open-source licence. On a PUBLIC repository a release asset is
      # downloadable by anyone, so attaching this JAR redistributes IBM's client to the world - the
      # exact thing the "Licensing note" section of README.md warns about. Note that an Actions
      # artifact is no safer: on a public repo those are world-readable too.
      #
      # Anyone can still build it themselves; README.md documents `mvn clean package`.
      #
      # To turn this on, set the repository variable PUBLISH_JAR to `true`
      # (Settings -> Secrets and variables -> Actions -> Variables). Read the licensing note first.
      - name: Attach the JAR to the release
        if: vars.PUBLISH_JAR == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "v${{ steps.versions.outputs.release }}"
          "target/mq-manager-${{ steps.versions.outputs.release }}.jar"
          --clobber

      - name: Summary
        run: |
          {
            echo "### Released \`v${{ steps.versions.outputs.release }}\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Released | \`${{ steps.versions.outputs.release }}\` |"
            echo "| main now on | \`${{ steps.versions.outputs.next }}\` |"
            echo "| JAR | \`$(du -h target/mq-manager.jar | cut -f1)\` |"
            if [ "${{ vars.PUBLISH_JAR }}" = "true" ]; then
              echo "| JAR attached | yes (PUBLISH_JAR is set) |"
            else
              echo "| JAR attached | no — see the licensing note in \`release.yml\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
